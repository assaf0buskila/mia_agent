[project]
name = "mia"
version = "0.1.0"
description = "AssafWeb AI Growth & Sales Operator"
readme = { text = "AssafWeb AI Growth & Sales Operator", content-type = "text/plain" }
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.141.1,<0.142.0",
  "langgraph>=1.2.11,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.15.0,<3",
  "sqlalchemy>=2.0.43,<3",
  "tzdata>=2025.1",
]

[project.scripts]
mia-due-scan = "app.workers.due_scan:main"
mia-reconcile = "app.workers.reconcile:main"
mia-migrate = "app.workers.migrate:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
