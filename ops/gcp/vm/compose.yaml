# Mia on one Google Cloud VM. Every service uses the host network. PostgreSQL and the app
# bind to 127.0.0.1, so only Caddy (80/443, profile "https") is reachable from outside.
#
# /etc/mia/settings.env  from Secret Manager (mia-env): API keys, models, feature flags
# /etc/mia/runtime.env   generated once on the VM: MIA_DATABASE_URL
# /etc/mia/postgres.env  generated once on the VM: database password
name: mia

services:
  caddy:
    image: caddy:2.11.4-alpine
    profiles: [https]
    network_mode: host
    volumes:
      - /opt/mia/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/mia/caddy-data:/data
      - /var/lib/mia/caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    # Same major version as the RDS instance it replaces, so pg_restore is exact.
    image: postgres:16
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "shared_buffers=128MB"]
    env_file: [/etc/mia/postgres.env]
    environment:
      # initdb runs once, for a NEW data directory. Without this it writes `trust` for 127.0.0.1 and
      # ::1 above the scram line the image appends, and with host networking any process on the VM
      # is then the superuser. The unix socket keeps its default: every VM tool reaches PostgreSQL
      # through it as `mia`. An existing cluster is fixed by ops/gcp/vm/pg-hba-harden.sh (E21).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - /var/lib/mia/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mia", "-d", "mia"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: mia:${MIA_TAG:?MIA_TAG is required}
    network_mode: host
    command: ["mia-migrate"]
    env_file: [/etc/mia/settings.env, /etc/mia/runtime.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  os-ledger-migrate:
    # Explicit owner-gated job only. Never part of deploy/start_services or app dependencies.
    image: mia:${MIA_TAG:?MIA_TAG is required}
    profiles: [os-ledger]
    network_mode: host
    entrypoint: ["python", "-m", "app.workers.os_ledger"]
    # runtime.env must contain V2-14a's demoted MAIN app DSN. The privileged ledger
    # migration DSN lives in a root-owned file mounted into this service only.
    env_file: [/etc/mia/os-ledger-migrate.env, /etc/mia/runtime.env]
    restart: "no"

  # V2-31: the privileged Assaf OS jobs. Every one is profile-off (the profile carries the job's
  # name), runs only when `mia os-authority` or `mia os-job` starts it, is never a dependency of
  # `app`, and reads its own job-only env file. The app service must stay the LAST service here.
  os-authority:
    # The authority fence and the cutover (section 16). It needs the privileged ledger DSN (the
    # same root-owned file `mia os-ledger` uses, checked to carry that one key), the demoted MAIN
    # DSN and the ledger runtime DSN (runtime.env, which wins), and the Assaf OS settings
    # (settings.env: the freeze, the backend, the epoch, the HMAC secret, the pepper).
    image: mia:${MIA_TAG:?MIA_TAG is required}
    profiles: [os-authority]
    network_mode: host
    entrypoint: ["os-authority"]
    env_file: [/etc/mia/settings.env, /etc/mia/os-ledger-migrate.env, /etc/mia/runtime.env]
    volumes:
      # The evidence directory (drain, preflight and activation written by the job; backup, drill,
      # frontend, journal and manifest placed by the operator). Owned by the job's user.
      - /var/lib/mia/os-authority:/var/lib/mia/os-authority
    restart: "no"

  os-import:
    # The owner's xlsx capture into the ledger (V2-30, phase by phase). scripts/ is not in the
    # image (the wheel ships `app` only), so the deployed tag's scripts are mounted read-only, as
    # `mia os-provision` mounts ops/assaf-os. It runs as the ledger RUNTIME role: no privileged DSN.
    image: mia:${MIA_TAG:?MIA_TAG is required}
    profiles: [os-import]
    network_mode: host
    entrypoint: ["python", "/app/scripts/os_import.py"]
    env_file: [/etc/mia/settings.env, /etc/mia/runtime.env]
    volumes:
      - /opt/mia/src/${MIA_TAG:?MIA_TAG is required}/scripts:/app/scripts:ro
      - /var/lib/mia/os-import:/var/lib/mia/os-import:ro
    restart: "no"

  os-verifier:
    # V2-18: recompute the summaries in full and flag drift. Ledger runtime role only.
    image: mia:${MIA_TAG:?MIA_TAG is required}
    profiles: [os-verifier]
    network_mode: host
    entrypoint: ["os-verifier"]
    env_file: [/etc/mia/settings.env, /etc/mia/runtime.env]
    restart: "no"

  os-retention:
    # V2-26: `expire_due` as the runtime role, then the purge and audit deletes as the retention
    # role. Its DSN, MIA_OS_LEDGER_RETENTION_DATABASE_URL, is in this service's job-only file and
    # nowhere else: not in mia-env, not in runtime.env (E8). `mia os-provision retention` creates it.
    image: mia:${MIA_TAG:?MIA_TAG is required}
    profiles: [os-retention]
    network_mode: host
    entrypoint: ["os-retention"]
    env_file: [/etc/mia/settings.env, /etc/mia/runtime.env, /etc/mia/os-retention.env]
    restart: "no"

  app:
    image: mia:${MIA_TAG:?MIA_TAG is required}
    network_mode: host
    # Same server as the ECS task, but bound to loopback: Caddy is the only public door.
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1",
              "--timeout-keep-alive", "130"]
    env_file: [/etc/mia/settings.env, /etc/mia/runtime.env]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped
