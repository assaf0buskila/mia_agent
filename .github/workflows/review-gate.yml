name: Review gate

# Publishes the `review-gate` commit status on a PR's current head SHA. It reads the PR from the
# API every time, so a new push, an edited PR body or a new verdict comment is re-evaluated, and
# re-running a failed run re-reads the same live state. A PR comment can only retrigger this once
# the workflow is on the default branch; until then, re-run the pull_request run by hand.
# Process control only: Claude and GPT push as the same GitHub user. Assaf's deploy go is the gate.
# Rules and owner actions: docs/COWORK.md.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

# The newest evaluation wins: each run reads the live state, so cancelling an older one is safe.
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Not named review-gate, so the job's check run cannot be mistaken for the status context.
  evaluate:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      REVIEW_GATE_ALLOWED_REVIEWERS: assaf0buskila
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Evaluate and publish the commit status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/ci/review_gate.py
